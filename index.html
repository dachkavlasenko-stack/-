 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Love ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe4ec, #f8d8ff, #ffe9e9);
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #75445d;
    overflow-x: hidden;
}

.container {
    width: 90%;
    max-width: 500px;
    padding: 35px 20px;
    text-align: center;
    background: rgba(255,255,255,0.65);
    border-radius: 30px;
    box-shadow: 0 10px 40px rgba(180,100,140,0.15);
    backdrop-filter: blur(10px);
}

h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 15px;
    margin-bottom: 30px;
    color: #a16b87;
}

.avatars {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.avatar {
    width: 115px;
    height: 115px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid white;
    box-shadow: 0 5px 15px rgba(180,100,140,0.2);
}

.heart {
    font-size: 30px;
    animation: heartbeat 1s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}

.counter-title {
    font-size: 18px;
    margin-bottom: 20px;
}

.counter {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.time-box {
    background: #fff0f5;
    border-radius: 15px;
    padding: 15px 5px;
}

.time-box span {
    display: block;
    font-size: 25px;
    font-weight: bold;
    color: #bd648d;
}

.time-box small {
    font-size: 12px;
    color: #a16b87;
}

.message {
    margin-top: 30px;
    font-size: 17px;
    line-height: 1.6;
}

.footer {
    margin-top: 25px;
    font-size: 13px;
    color: #b47b96;
}

.floating-heart {
    position: fixed;
    bottom: -30px;
    animation: float 7s linear infinite;
    pointer-events: none;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Our Love ❤️</h1>

    <p class="subtitle">
        Две души, одна история
    </p>

    <div class="avatars">

        <img src="avatar1.jpg" class="avatar" alt="Моя аватарка">

        <div class="heart">❤️</div>

        <img src="avatar2.jpg" class="avatar" alt="Аватарка любимого человека">

    </div>

    <p class="counter-title">
        Мы вместе уже:
    </p>

    <div class="counter">

        <div class="time-box">
            <span id="days">0</span>
            <small>Дней</small>
        </div>

        <div class="time-box">
            <span id="hours">0</span>
            <small>Часов</small>
        </div>

        <div class="time-box">
            <span id="minutes">0</span>
            <small>Минут</small>
        </div>

        <div class="time-box">
            <span id="seconds">0</span>
            <small>Секунд</small>
        </div>

    </div>

    <div class="message">
        Ты — моё любимое совпадение.<br>
        И я хочу, чтобы наша история<br>
        продолжалась бесконечно. 💗
    </div>

    <div class="footer">
        Made with love ❤️
    </div>

</div>

<script>

// ВПИШИ ДАТУ НАЧАЛА ВАШИХ ОТНОШЕНИЙ
const startDate = new Date("2026-01-01T00:00:00");

function updateCounter() {

    const now = new Date();
    const difference = now - startDate;

    if (difference < 0) return;

    const totalSeconds = Math.floor(difference / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

setInterval(updateCounter, 1000);
updateCounter();

// Плавающие сердечки

function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.textContent = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 15) + "px";
    heart.style.animationDuration = (5 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 1000);

</script>

</body>
</html>
